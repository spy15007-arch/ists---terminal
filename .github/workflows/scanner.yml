name: Automated Quant Market Scanner

on:
  schedule:
    # Runs Monday to Friday at 9:00 AM IST (3:30 AM UTC) and 3:00 PM IST (9:30 AM UTC)
    - cron: '30 3 * * 1-5'
    - cron: '30 9 * * 1-5'
  workflow_dispatch: # Allows you to also trigger it manually anytime from GitHub

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy scipy requests

      - name: Run Master Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python master_scanner.py
