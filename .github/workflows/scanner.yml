name: Master Quant Scanner

on:
  workflow_dispatch: # Allows you to trigger manual runs anytime from GitHub
  schedule:
    - cron: '30 3,6 * * 1-5' # Runs automatically Mon-Fri at 9:00 AM IST (3:30 UTC) and 11:30 AM IST (6:00 UTC)

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push updated markdown reports back to the repo
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy scipy requests

      - name: Run Master Quant Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python master_scanner.py

      - name: Commit and Push Updated Reports
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add intraday_report.md btst_report.md swing_report.md
          git commit -m "Auto-update quant scanner markdown reports [skip ci]" || exit 0
          git push
