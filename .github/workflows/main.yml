name: ISTS Master Scanner Automation

on:
  schedule:
    # Morning Intraday Scan: 09:15 AM IST (03:45 UTC) Mon-Fri
    - cron: '45 3 * * 1-5'
    # Afternoon BTST Scan: 03:05 PM IST (09:35 UTC) Mon-Fri
    - cron: '35 9 * * 1-5'
  
  # This line allows you to click a "Run workflow" button to test it manually anytime!
  workflow_dispatch: 

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    
    # Grants permission to push the markdown files back to your repository
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy scipy requests

      - name: Run Master Scanner
        run: python master_scanner.py

      - name: Commit and Push Markdown Reports
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add *.md
          git commit -m "Auto-update quant reports" || echo "No changes to commit"
          git push
