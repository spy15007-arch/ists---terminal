- name: Run Market Scanners
        run: |
          python run_scan.py
          python run_budget_scan.py
          python run_aggressive_scan.py
      - name: Commit & Push Updated Reports
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add breakoutsummary.md budgetsummary.md aggressivesummary.md
          git commit -m "Auto-update all market summary reports" || exit 0
          git push
