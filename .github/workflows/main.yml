name: Automated Market Scanner

on:
  workflow_dispatch: # Allows manual trigger anytime
  schedule:
    # 1. Morning Intraday / F&O Scan at 9:15 AM IST (03:45 UTC), Monday-Friday
    - cron: '45 3 * * 1-5'
    
    # 2. BTST / Swing Pre-Close Scan at 3:10 PM IST (09:40 UTC), Monday-Friday
    - cron: '40 9 * * 1-5'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install yfinance pandas numpy requests
      - name: Run Market Scanner
        run: python run_scan.py
      - name: Commit & Push Updated Report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add breakoutsummary.md
          git commit -m "Auto-update breakoutsummary.md report" || exit 0
          git push
