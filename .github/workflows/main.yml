name: Automated Quant Market Scanner

on:
  schedule:
    # Morning Scan: Monday to Friday at 8:30 AM IST (3:00 AM UTC)
    - cron: '0 3 * * 1-5'
    # Afternoon/BTST Scan: Monday to Friday at 2:30 PM IST (9:00 AM UTC)
    - cron: '0 9 * * 1-5'
  workflow_dispatch: # Enables the manual "Run workflow" button on GitHub

jobs:
  run-scanner:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy scipy requests

      - name: Run Master Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python master_scanner.py
