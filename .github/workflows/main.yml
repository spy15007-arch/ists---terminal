name: Automated Market Scanner

on:
  workflow_dispatch:
  schedule:
    # 1st Scan: 09:15 AM IST (03:45 AM UTC), Mon-Fri
    - cron: '45 3 * * 1-5'
    # 2nd Scan: 03:15 PM IST (09:45 AM UTC), Mon-Fri
    - cron: '45 9 * * 1-5'

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install yfinance pandas numpy requests
      - name: Run Market Scanners
        run: |
          python run_scan.py
          python run_budget_scan.py
          python run_aggressive_scan.py
      - name: Commit & Push Updated Reports
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add *.md
          git commit -m "Auto-update all market summary reports" || exit 0
          git push
