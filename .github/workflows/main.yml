name: Master Quant Scanner

on:
  schedule:
    # Morning Scan: 03:45 UTC = 09:15 AM IST
    - cron: '45 3 * * 1-5'
    # Afternoon Scan: 09:35 UTC = 15:05 PM IST
    - cron: '35 9 * * 1-5'
  workflow_dispatch: 

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install yfinance pandas numpy scipy requests

      - name: Run Master Quant Scanner
        run: python master_scanner.py

      - name: Push to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_push.py
