name: ISTS Quant Market Scanner

on:
  workflow_dispatch: 
  schedule:
    - cron: '45 3 * * 1-5'
    - cron: '45 9 * * 1-5'

jobs:
  quant_scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests scipy

      - name: Run Master Quant Scanner
        run: python master_scanner.py

      - name: Push Reports to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_push.py
          
      - name: Commit & Push Updated Reports
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add *.md
          git commit -m "Auto-update quant reports" || echo "No changes to commit"
          git push
